<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AiDiA My BFF – Your Companion, Always There</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--primary:#1C3A5E;
--primary-mid:#3D5A80;
--accent:#C0392B;
--text:#1C2B3A;
--muted:#5a6a78;
--bg:#F8FAFC;
--radius:16px;
--card-shadow:0 8px 32px rgba(28,58,94,0.12);
}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;}
section{padding:80px 7%;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 7%;background:white;backdrop-filter:blur(10px);}
.nav-links{display:flex;gap:20px;list-style:none;}
.nav-links a{text-decoration:none;color:var(--text);font-weight:600;}
.nav-cta{background:var(--accent);color:white;padding:10px 18px;border-radius:50px;text-decoration:none;}

/* HERO */
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.hero-image-first img{width:100%;height:100vh;object-fit:cover;}
.hero-text-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:20px;background:rgba(0,0,0,0.25);}
.hero-btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

.btn-primary,.btn-outline{
padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:700;transition:0.3s;
}
.btn-primary{background:var(--accent);color:white;}
.btn-primary:hover{transform:translateY(-3px);}
.btn-outline{border:1px solid white;color:white;}
.btn-outline:hover{background:white;color:black;}

/* VIDEO MODAL */
.video-modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
align-items:center;justify-content:center;z-index:9999;
}
.video-box{width:90%;max-width:700px;background:black;border-radius:16px;overflow:hidden;position:relative;}
.video-box video{width:100%;}
.close-btn{position:absolute;top:10px;right:10px;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;}

/* WHO */
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:40px;}
.who-card{background:white;border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow);}
.who-card-img img{width:100%;height:250px;object-fit:contain;}
.who-card-body{padding:20px;}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.contact-form,.contact-info-card{background:white;padding:30px;border-radius:16px;box-shadow:var(--card-shadow);}
input,textarea{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ccc;}
button{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:50px;font-weight:700;cursor:pointer;}

/* MOBILE */
@media(max-width:900px){
.contact-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div><strong>AiDiA</strong></div>
<ul class="nav-links">
<li><a href="#who">Who</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
<a class="nav-cta" href="#contact">Get in Touch</a>
</nav>

<!-- HERO -->
<section id="hero">
<div class="hero-image-first">
<img src="images/bear-white.png">
</div>

<div class="hero-text-overlay">
<div>
<h1>Never Feel Alone Again</h1>
<p>AiDiA is your AI companion bear.</p>

<div class="hero-btns">
<a class="btn-primary" href="#who">Discover</a>
<a class="btn-outline" href="#contact">Contact</a>
</div>
</div>
</div>
</section>

<!-- WHO -->
<section id="who">
<h2>Who It's For</h2>

<div class="who-grid">

<div class="who-card">
<img src="images/aidia-kids.png">
<div class="who-card-body">
<h3>Teens & Children</h3>
<p>Safe emotional companion.</p>

<button onclick="openKidsVideo()" class="btn-primary" style="margin-top:10px;">
Watch Video
</button>
</div>
</div>

</div>
</section>

<!-- VIDEO MODAL -->
<div id="kidsModal" class="video-modal">
<div class="video-box">
<button class="close-btn" onclick="closeKidsVideo()">✕</button>
<video id="kidsVideo" controls>
<source src="videos/aidia-video3.mp4">
</video>
</div>
</div>

<!-- CONTACT (FORMSUBMIT READY) -->
<section id="contact">

<h2>Contact Us</h2>

<div class="contact-grid">

<div class="contact-info-card">
<p>Email: aidiateddy@gmail.com</p>
</div>

<!-- FORM -->
<form class="contact-form"
action="https://formsubmit.co/aidiateddy@gmail.com"
method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New AiDiA Enquiry">

<input type="text" name="name" placeholder="Name" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="message" placeholder="Message" required></textarea>

<button type="submit">Send Message</button>
</form>

</div>
</section>

<script>

/* VIDEO MODAL */
function openKidsVideo(){
document.getElementById("kidsModal").style.display="flex";
document.getElementById("kidsVideo").play();
}

function closeKidsVideo(){
document.getElementById("kidsModal").style.display="none";
const v=document.getElementById("kidsVideo");
v.pause();v.currentTime=0;
}

/* CLICK OUTSIDE CLOSE */
document.getElementById("kidsModal").addEventListener("click",(e)=>{
if(e.target.id==="kidsModal") closeKidsVideo();
});

/* ESC CLOSE */
document.addEventListener("keydown",(e)=>{
if(e.key==="Escape") closeKidsVideo();
});

</script>

</body>
</html>
