<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AiDiA My BFF</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#f8fafc;color:#1c2b3a;line-height:1.6;overflow-x:hidden}

/* NAV */
nav{
position:fixed;top:0;left:0;right:0;z-index:100;
display:flex;justify-content:space-between;align-items:center;
padding:12px 6%;
background:#fff;backdrop-filter:blur(10px);
border-bottom:1px solid #ddd;
}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{text-decoration:none;font-weight:600;color:#1c2b3a;font-size:14px}

/* HERO */
#hero{
display:grid;
grid-template-columns:1fr 1fr;
padding:120px 6% 60px;
gap:40px;
background:linear-gradient(135deg,#f0f4f8,#fff);
}
.hero-main-img img{
width:100%;
height:100%;
object-fit:contain;   /* FIX CROPPING */
border-radius:20px;
}

/* SECTIONS */
section{padding:70px 6%}

/* CAROUSEL */
.carousel-container{
max-width:1000px;
margin:auto;
position:relative;
overflow:hidden;
border-radius:20px;
background:#fff;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.carousel-slide{
display:none;
text-align:center;
padding:20px;
}

.carousel-slide.active{display:block}

.carousel-slide img{
width:100%;
height:420px;
object-fit:contain; /* FIX CROPPING */
background:#f5f5f5;
}

.carousel-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:#fff;
border:none;
width:45px;height:45px;
border-radius:50%;
cursor:pointer;
font-size:20px;
}

.prev{left:10px}
.next{right:10px}

.carousel-dots{
text-align:center;
padding:10px;
}

.dot{
height:10px;width:10px;
display:inline-block;
border-radius:50%;
background:#ccc;
margin:5px;
cursor:pointer;
}

.active-dot{background:#1c3a5e}

/* FEATURES FIX */
.features-layout{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

/* VIDEO FIX */
.videos-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

video{
width:100%;
border-radius:12px;
object-fit:contain;
}

/* MOBILE */
@media(max-width:900px){
#hero{grid-template-columns:1fr}
.nav-links{display:none}
.features-layout{grid-template-columns:1fr}
.videos-grid{grid-template-columns:1fr}
.carousel-slide img{height:280px}
}
</style>
</head>

<body>

<nav>
<div><strong>AiDiA My BFF</strong></div>
<ul class="nav-links">
<li><a href="#hero">Home</a></li>
<li><a href="#products">Products</a></li>
<li><a href="#videos">Videos</a></li>
</ul>
</nav>

<section id="hero">
<div>
<h1>Never Feel Alone Again</h1>
<p>An AI companion teddy that connects emotionally.</p>
</div>

<div class="hero-main-img">
<img src="images/child-with-bear.JPG" />
</div>
</section>

<section id="products">
<h2>Product Showcase</h2>

<div class="carousel-container">

<div class="carousel-slide active">
<img src="images/sitting-bears.JPG">
<p>White Bear Edition</p>
</div>

<div class="carousel-slide">
<img src="images/blue-and-white-bear.JPG">
<p>Blue Edition</p>
</div>

<div class="carousel-slide">
<img src="images/white-and-blue-bear.JPG">
<p>Special Edition</p>
</div>

<button class="carousel-btn prev" onclick="changeSlide(-1)">❮</button>
<button class="carousel-btn next" onclick="changeSlide(1)">❯</button>

<div class="carousel-dots">
<span class="dot active-dot" onclick="goToSlide(0)"></span>
<span class="dot" onclick="goToSlide(1)"></span>
<span class="dot" onclick="goToSlide(2)"></span>
</div>

</div>
</section>

<section id="videos">
<h2>Videos</h2>

<div class="videos-grid">
<video controls>
<source src="videos/aidia-video1.mp4">
</video>

<video controls>
<source src="videos/aidia-video2.mp4">
</video>
</div>
</section>

<script>
let current = 0;
const slides = document.querySelectorAll(".carousel-slide");
const dots = document.querySelectorAll(".dot");

function show(i){
slides.forEach(s=>s.classList.remove("active"));
dots.forEach(d=>d.classList.remove("active-dot"));

current = (i + slides.length) % slides.length;
slides[current].classList.add("active");
dots[current].classList.add("active-dot");
}

function changeSlide(step){show(current+step)}
function goToSlide(i){show(i)}

setInterval(()=>changeSlide(1),5000);
</script>

</body>
</html>
