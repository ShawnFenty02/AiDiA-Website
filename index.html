<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AiDiA My BFF</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#f8fafc;color:#1c2b3a;line-height:1.6}
html{scroll-behavior:smooth}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:999;display:flex;justify-content:space-between;align-items:center;padding:14px 7%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{text-decoration:none;color:#1c2b3a;font-weight:600}
.nav-cta{background:#c0392b;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none}

/* HERO */
#hero{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;padding:120px 7% 60px;gap:40px}
.hero-img img{width:100%;height:100%;object-fit:contain}

/* 3D INTRO */
#intro3d{
position:fixed;
inset:0;
background:#0b1a2b;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 3s ease forwards;
animation-delay:3.5s;
}
.bear{
width:180px;
height:180px;
background:url('images/bear-white.png') center/contain no-repeat;
animation:float 2s infinite ease-in-out;
filter:drop-shadow(0 20px 30px rgba(0,0,0,.4));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* CAROUSEL */
.carousel-container{position:relative;max-width:900px;margin:auto;overflow:hidden}
.carousel-slide{display:none}
.carousel-slide.active{display:block}
.carousel-slide img{
width:100%;
height:450px;
object-fit:contain;
background:#fff;
}

/* CHAT */
#chatBtn{
position:fixed;bottom:20px;right:20px;
background:#1c3a5e;color:#fff;
padding:14px 18px;border-radius:50px;
cursor:pointer;z-index:999
}

#chatBox{
position:fixed;bottom:80px;right:20px;
width:300px;height:400px;
background:#fff;border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
display:none;flex-direction:column;
overflow:hidden;z-index:9999
}

#chatMessages{flex:1;padding:10px;overflow:auto}
#chatInput{display:flex}
#chatInput input{flex:1;padding:10px;border:none;border-top:1px solid #ddd}
#chatInput button{background:#1c3a5e;color:#fff;border:none;padding:10px}

</style>
</head>

<body>

<!-- 3D INTRO -->
<div id="intro3d">
  <div class="bear"></div>
</div>

<!-- NAV -->
<nav>
  <div><strong>AiDiA</strong> My BFF</div>
  <ul class="nav-links">
    <li><a href="#hero">Home</a></li>
    <li><a href="#products">Bear</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <a class="nav-cta" href="#contact">Get Started</a>
</nav>

<!-- HERO -->
<section id="hero">
  <div>
    <h1>Never Feel Alone Again</h1>
    <p>AI companion bear that talks, listens, and connects emotionally.</p>
  </div>
  <div class="hero-img">
    <img src="images/child-with-bear.JPG" />
  </div>
</section>

<!-- CAROUSEL -->
<section id="products">
<div class="carousel-container">

  <div class="carousel-slide active">
    <img src="images/sitting-bears.JPG">
  </div>

  <div class="carousel-slide">
    <img src="images/blue-and-white-bear.JPG">
  </div>

  <div class="carousel-slide">
    <img src="images/white-and-blue-bear.JPG">
  </div>

</div>
</section>

<!-- CHAT BUTTON -->
<div id="chatBtn" onclick="toggleChat()">💬 Chat AiDiA</div>

<div id="chatBox">
  <div id="chatMessages"></div>
  <div id="chatInput">
    <input id="msg" placeholder="Talk to AiDiA...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
let chatOpen=false;

function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById("chatBox").style.display=chatOpen?"flex":"none";
}

/* REAL AI CALL (OpenAI) */
async function sendMsg(){
  const input=document.getElementById("msg");
  const msg=input.value;
  if(!msg) return;

  const box=document.getElementById("chatMessages");
  box.innerHTML+=`<div><b>You:</b> ${msg}</div>`;

  input.value="";

  const res = await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer YOUR_API_KEY_HERE"
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[
        {role:"system",content:"You are AiDiA, a caring companion teddy bear AI."},
        {role:"user",content:msg}
      ]
    })
  });

  const data = await res.json();
  const reply = data.choices?.[0]?.message?.content || "Error";

  box.innerHTML+=`<div><b>AiDiA:</b> ${reply}</div>`;
  box.scrollTop=box.scrollHeight;
}

/* CAROUSEL */
let i=0;
setInterval(()=>{
  const slides=document.querySelectorAll(".carousel-slide");
  slides.forEach(s=>s.classList.remove("active"));
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
},3000);
</script>

</body>
</html>
