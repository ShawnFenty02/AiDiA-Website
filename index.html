<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiDiA My BFF – Your Companion, Always There</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1C3A5E;
      --primary-mid: #3D5A80;
      --primary-light: #E8EFF7;
      --accent: #C0392B;
      --accent2: #81B29A;
      --text: #1C2B3A;
      --muted: #5a6a78;
      --bg: #F8FAFC;
      --white: #fff;
      --warm: #FDF6F0;
      --radius: 16px;
      --card-shadow: 0 8px 32px rgba(28,58,94,0.12);
    }

    body {
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    img{
      object-fit: contain !important;
      max-width: 100%;
    }

    html { scroll-behavior: smooth; }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 7%;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
    }

    /* HERO */
    #hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 120px 7% 60px;
      min-height: 100vh;
    }

    /* SECTIONS */
    section { padding: 80px 7%; }

    .section-title {
      font-family: "Playfair Display";
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .section-sub { color: var(--muted); }

    /* CAROUSEL */
    .carousel-container {
      max-width: 900px;
      margin: auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .carousel-slide { display: none; }
    .carousel-slide.active { display: block; }

    .carousel-slide img {
      width: 100%;
      height: 520px;
      object-fit: contain;
      background: white;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      z-index: 10;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    /* VIDEO FIX */
    #videos {
      background: var(--primary);
      color: white;
    }

    #videos .section-sub { color: rgba(255,255,255,0.7); }

    .videos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    video {
      width: 100%;
      border-radius: 12px;
    }

    /* CONTACT */
    .form-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
    }

    /* MOBILE */
    @media(max-width: 900px){
      #hero { grid-template-columns: 1fr; }
      .videos-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }

  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <div><b>AiDiA</b></div>
  <ul class="nav-links">
    <li><a href="#hero">Home</a></li>
    <li><a href="#products">Bear</a></li>
    <li><a href="#videos">Videos</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">
  <div>
    <h1>Never Feel Alone Again</h1>
    <p>AiDiA is your AI companion bear.</p>
  </div>

  <img src="images/child-with-bear.JPG" />
</section>

<!-- WHOLE CAROUSEL -->
<section id="products">
  <div class="carousel-container">

    <div class="carousel-slide active">
      <img src="images/sitting-bears.JPG">
    </div>

    <div class="carousel-slide">
      <img src="images/blue-and-white-bear.JPG">
    </div>

    <div class="carousel-slide">
      <img src="images/white-and-blue-bear.JPG">
    </div>

    <button class="carousel-btn prev" onclick="move(-1)">❮</button>
    <button class="carousel-btn next" onclick="move(1)">❯</button>

  </div>
</section>

<!-- VIDEOS -->
<section id="videos">
  <h2 class="section-title">See AiDiA in Action</h2>
  <p class="section-sub">Real interaction videos</p>

  <div class="videos-grid">
    <video controls>
      <source src="videos/aidia-video1.mp4">
    </video>

    <video controls>
      <source src="videos/aidia-video2.mp4">
    </video>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2 class="section-title">Contact</h2>

  <form onsubmit="handleSubmit(event)">
    <input placeholder="Name" required><br><br>
    <input placeholder="Email" required><br><br>
    <textarea placeholder="Message"></textarea><br><br>
    <button class="form-submit">Send</button>
  </form>
</section>

<script>
/* CAROUSEL */
let i = 0;
const slides = document.querySelectorAll(".carousel-slide");

function show(n){
  slides.forEach(s => s.classList.remove("active"));
  i = (n + slides.length) % slides.length;
  slides[i].classList.add("active");
}

function move(n){ show(i + n); }
setInterval(() => move(1), 4000);
show(0);

/* FORM */
function handleSubmit(e){
  e.preventDefault();
  alert("Sent!");
}
</script>

</body>
</html>
