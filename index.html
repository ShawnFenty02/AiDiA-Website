<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AiDiA My BFF</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter;background:#f8fafc;color:#1c2b3a;line-height:1.6}

/* FIX IMAGES (NO CROPPING) */
img{
  object-fit:contain !important;
  max-width:100%;
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 6%;
  background:#fff;
  z-index:999;
}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{text-decoration:none;color:#333;font-weight:600}

/* HERO */
#hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:120px 6% 60px;
  gap:40px;
  min-height:100vh;
}
.hero-img img{width:100%;border-radius:20px}

/* SECTIONS */
section{padding:80px 6%}

/* CAROUSEL FIX */
.carousel-container{
  position:relative;
  max-width:900px;
  margin:auto;
  overflow:hidden;
  border-radius:20px;
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.carousel-slide{display:none}
.carousel-slide.active{display:block}
.carousel-slide img{
  width:100%;
  height:450px;
  object-fit:contain;
  background:#fff;
}
.carousel-btn{
  position:absolute;top:50%;
  transform:translateY(-50%);
  background:white;
  border:none;
  padding:10px;
  cursor:pointer;
}
.prev{left:10px}
.next{right:10px}

/* CHAT WIDGET */
#chatBubble{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#1c3a5e;
  color:#fff;
  padding:14px;
  border-radius:50px;
  cursor:pointer;
  z-index:9999;
}

#chatBox{
  position:fixed;
  bottom:80px;
  right:20px;
  width:300px;
  height:400px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  display:none;
  flex-direction:column;
  overflow:hidden;
}

#chatMessages{
  flex:1;
  padding:10px;
  overflow:auto;
  font-size:14px;
}

#chatInput{
  display:flex;
  border-top:1px solid #ddd;
}

#chatInput input{
  flex:1;
  padding:10px;
  border:none;
}

#chatInput button{
  background:#1c3a5e;
  color:#fff;
  border:none;
  padding:10px;
}

/* INTRO 3D */
#intro{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#1c3a5e,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:99999;
  animation:fadeOut 4s forwards;
}
.bear{
  font-size:80px;
  animation:float 2s infinite ease-in-out;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}
@keyframes fadeOut{
  0%{opacity:1}
  80%{opacity:1}
  100%{opacity:0;visibility:hidden}
}

/* MOBILE */
@media(max-width:768px){
#hero{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- 3D INTRO -->
<div id="intro">
  <div class="bear">🧸</div>
  <h1 style="color:white">AiDiA is waking up...</h1>
</div>

<!-- NAV -->
<nav>
  <div><b>AiDiA</b></div>
  <ul class="nav-links">
    <li><a href="#hero">Home</a></li>
    <li><a href="#products">Bear</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">
  <div>
    <h1>Never Feel Alone Again</h1>
    <p>AiDiA is your AI companion bear.</p>
  </div>

  <div class="hero-img">
    <img src="images/child-with-bear.JPG"/>
  </div>
</section>

<!-- CAROUSEL -->
<section id="products">
<div class="carousel-container">

  <div class="carousel-slide active">
    <img src="images/sitting-bears.JPG">
  </div>

  <div class="carousel-slide">
    <img src="images/blue-and-white-bear.JPG">
  </div>

  <button class="carousel-btn prev" onclick="move(-1)">❮</button>
  <button class="carousel-btn next" onclick="move(1)">❯</button>

</div>
</section>

<!-- CHAT -->
<div id="chatBubble" onclick="toggleChat()">💬 Chat</div>

<div id="chatBox">
  <div id="chatMessages"></div>

  <div id="chatInput">
    <input id="msg" placeholder="Talk to AiDiA..."/>
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
let index=0;
const slides=document.querySelectorAll(".carousel-slide");

function show(i){
  slides.forEach(s=>s.classList.remove("active"));
  index=(i+slides.length)%slides.length;
  slides[index].classList.add("active");
}
function move(i){show(index+i);}
setInterval(()=>move(1),4000);

/* CHAT */
function toggleChat(){
  const box=document.getElementById("chatBox");
  box.style.display = box.style.display==="flex"?"none":"flex";
}

async function sendMsg(){
  const input=document.getElementById("msg");
  const msg=input.value;
  if(!msg)return;

  add("You: "+msg);
  input.value="";

  const res = await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  const data = await res.json();
  add("AiDiA: "+data.reply);
}

function add(text){
  const div=document.createElement("div");
  div.textContent=text;
  document.getElementById("chatMessages").appendChild(div);
}

/* REMOVE INTRO AFTER LOAD */
setTimeout(()=>document.getElementById("intro").remove(),3500);
</script>

</body>
</html>
