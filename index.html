<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AiDiA My BFF</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f8fafc;overflow-x:hidden}

/* NAV */
nav{
position:fixed;top:0;left:0;right:0;
display:flex;justify-content:space-between;
padding:12px 6%;
background:white;z-index:1000
}
nav a{text-decoration:none;margin:0 10px;color:#333}

/* HERO */
.hero{
display:grid;
grid-template-columns:1fr 1fr;
min-height:100vh;
padding:120px 6% 60px;
gap:40px
}
.hero h1{font-size:42px}
.hero p{margin:15px 0;color:#555}

/* 3D BOX */
#bear3d{
width:100%;
height:420px;
background:#e9eef5;
border-radius:20px
}

/* CAROUSEL */
.carousel{
position:relative;
max-width:900px;
margin:auto;
overflow:hidden;
border-radius:20px;
background:#fff;
box-shadow:0 10px 30px rgba(0,0,0,.1)
}
.slide{
display:none;
}
.slide.active{display:block}
.slide img{
width:100%;
height:420px;
object-fit:contain; /* FIX CROPPING */
background:#f4f4f4;
}
.controls{
position:absolute;top:50%;width:100%;
display:flex;justify-content:space-between;
transform:translateY(-50%)
}
.controls button{
background:white;border:none;
padding:10px 15px;cursor:pointer
}

/* SECTIONS */
section{padding:80px 6%}

/* MOBILE */
@media(max-width:900px){
.hero{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div><b>AiDiA</b></div>
<div>
<a href="#carousel">Bears</a>
<a href="#about">About</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<div>
<h1>Never Feel Alone Again</h1>
<p>Your AI companion teddy bear with real emotion, memory & voice.</p>
</div>

<!-- 3D BEAR -->
<div id="bear3d"></div>
</section>

<!-- CAROUSEL -->
<section id="carousel">
<h2>AiDiA Bears</h2>

<div class="carousel">

<div class="slide active">
<img src="images/bear1.jpg">
</div>

<div class="slide">
<img src="images/bear2.jpg">
</div>

<div class="slide">
<img src="images/bear3.jpg">
</div>

<!-- ADD MORE IMAGES HERE -->
<div class="slide">
<img src="images/bear4.jpg">
</div>

<div class="controls">
<button onclick="move(-1)">‹</button>
<button onclick="move(1)">›</button>
</div>

</div>
</section>

<!-- ABOUT -->
<section id="about">
<h2>About AiDiA</h2>
<p>AiDiA is designed to bring companionship using AI + robotics + emotional interaction.</p>
</section>

<!-- THREE.JS 3D MODEL -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);

let renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(420,420);
document.getElementById("bear3d").appendChild(renderer.domElement);

let light = new THREE.AmbientLight(0xffffff,1);
scene.add(light);

let directional = new THREE.DirectionalLight(0xffffff,1);
directional.position.set(2,2,2);
scene.add(directional);

let bear;

let loader = new THREE.GLTFLoader();
loader.load('/models/aidia-bear.glb', function(gltf){
bear = gltf.scene;
bear.scale.set(2,2,2);
scene.add(bear);
});

camera.position.z = 3;

function animate(){
requestAnimationFrame(animate);

if(bear){
bear.rotation.y += 0.01; // spinning animation
}

renderer.render(scene,camera);
}
animate();
</script>

<!-- CAROUSEL SCRIPT -->
<script>
let index = 0;
const slides = document.querySelectorAll(".slide");

function show(i){
slides.forEach(s=>s.classList.remove("active"));
index = (i + slides.length) % slides.length;
slides[index].classList.add("active");
}

function move(step){
show(index + step);
}

setInterval(()=>move(1),5000);
</script>

</body>
</html>
